[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-python-sdk"
version = "0.1.0"
description = "Async Python SDK for YouTube Data API v3 and YouTube Analytics API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Inoue AI" }]
keywords = ["youtube", "api", "sdk", "async", "python", "google"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "aioresponses>=0.7.6",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/inoue-ai/youtube-python-sdk"
Documentation = "https://github.com/inoue-ai/youtube-python-sdk#readme"
Repository = "https://github.com/inoue-ai/youtube-python-sdk"
Issues = "https://github.com/inoue-ai/youtube-python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["youtube"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID", "RUF"]
ignore = ["E501", "RUF012", "RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["youtube"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["youtube"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
